
<!DOCTYPE html>
<html lang="en">
<head>
    <title>DevOps Employee Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 60px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            max-width: 650px;

            color: #1565c0;
        }

        <h1>DevOps Employee Portal</h1>

</html>
